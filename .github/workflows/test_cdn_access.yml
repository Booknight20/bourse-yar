name: Test TSETMC CDN Access
on:
  workflow_dispatch:
jobs:
  test-cdn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Test CDN endpoints
        run: python test_cdn_access.py
